services: 
  postgres: 
    image: mysql:latest
    restart: unless-stopped
    container_name: drizzlemysql
    ports: 
    - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: rootPassword
      MYSQL_ROOT_USER: root
      MYSQL_DATABASE: drizzlemysql
      MYSQL_USER: regularUser
      MYSQL_PASSWORD: regularuser